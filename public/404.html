<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Turo</title>
    <script>
      // GitHub Pages SPA fallback (técnica rafgraph/spa-github-pages).
      // Codifica la URL solicitada en query params y redirige a /index.html;
      // el script en index.html la decodifica y usa history.replaceState
      // para que React Router tome la ruta correcta.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
